services:
  db:
    image: postgres:16
    container_name: canchaya-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: canchaya
    ports:
      - "5434:5432" # 5434 para no chocar con FiadoYa (5433)
    volumes:
      - canchaya-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  canchaya-data:
